awsRegion: eu-central-1

default_llm_type: qwen3_32b

databases:
  local_dir: data/spider/database   # relative to the repository root; used when DATABASE_BUCKET is not set
  s3_prefix: databases/              # <bucket>/databases/<db_id>/<db_id>.sqlite on AWS
  query_timeout_s: 60

llms:
  ollama:
    provider: ollama
    host: http://localhost:11434
    model_id: qwen3:8b
    max_tokens: 2048
    temperature: 0

  qwen3_32b:
    provider: bedrock
    model_id: qwen.qwen3-32b-v1:0
    max_tokens: 2048
    temperature: 0
