name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Terraform environment to apply"
        required: true
        type: choice
        options:
          - dev
          - preprod
          - prod

      plan_run_id:
        description: "GitHub Actions run ID of the Terraform Plan workflow"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  apply:
    name: Terraform Apply - ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Task
        uses: go-task/setup-task@v1

      - name: Install tfswitch
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"

          curl -L https://raw.githubusercontent.com/warrensbox/terraform-switcher/release/install.sh \
            | bash -s -- -b "$HOME/.local/bin"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          "$HOME/.local/bin/tfswitch" --version

      - name: Download Terraform plan
        uses: actions/download-artifact@v5
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: terraform
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ github.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Apply
        run: task tf:apply ENV=${{ inputs.environment }}