[project]
name = "text2sql"
version = "0.0.8"
requires-python = ">=3.12.3,<3.13"
dependencies = [
    "boto3>=1.39.9,<2",
    "botocore>=1.34.99,<2",
    "pyyaml>=6.0.2,<7",
    "ollama==0.6.2",
    "sqlglot==30.21.0",
    "langgraph==1.2.14"
]

[tool.pytest.ini_options]
log_format = "%(asctime)s %(levelname)s %(name)s %(message)s"
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "environs>=9.5.0,<10",
    "jsonschema>=4.22.0,<5",
    "jupyter>=1.1.1,<2",
    "numpy>=1.26,<2",
    "openpyxl>=3.1.5,<4",
    "pandas>=2.3.2,<3",
    "pandas-stubs>=2.3.2.250827, <3",
    "python-dotenv>=1.0.1,<2",
    "types-tabulate>=0.9.0.20241207,<1",
    "moto>=5.0.6,<6",
    "mypy>=1.10.0,<2",
    "nbqa>=1.9.1,<2",
    "pip-licenses>=4.4.0,<5",
    "pre-commit>=3.7.0,<4",
    "pytest>=8.2.0,<9",
    "pytest-cov>=5.0.0,<6",
    "pytest-forked>=1.6.0,<2",
    "pytest-lazy-fixture>=0.6.3,<0.7",
    "pytest-mock>=3.14.0,<4",
    "pytest-sugar>=1.0.0,<2",
    "pytest-xdist>=3.6.1,<4",
    "requests-mock>=1.12.1,<2",
    "types-requests>=2.31.0,<3",
    "ruff>=0.12,<0.13",
    "vulture~=2.11",
]

[tool.coverage.report]
show_missing = true
fail_under = 0
omit = ["*/__init__.py",
    ".mypy_cache",
    ".pytest_cache",
    "./docs",
    "./public", ]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi_"
url = "https://pypi.org/simple"
default = true


[tool.uv.sources]
moto = { index = "pypi_" }
nbqa = { index = "pypi_" }
pre-commit = { index = "pypi_" }
pytest = { index = "pypi_" }
pytest-cov = { index = "pypi_" }
pytest-forked = { index = "pypi_" }
pytest-lazy-fixture = { index = "pypi_" }
pytest-mock = { index = "pypi_" }
pytest-sugar = { index = "pypi_" }
pytest-xdist = { index = "pypi_" }
requests-mock = { index = "pypi_" }
types-requests = { index = "pypi_" }
ruff = { index = "pypi_" }
vulture = { index = "pypi_" }
boto3 = { index = "pypi_" }
botocore = { index = "pypi_" }
environs = { index = "pypi_" }
jsonschema = { index = "pypi_" }
jupyter = { index = "pypi_" }
numpy = { index = "pypi_" }
openpyxl = { index = "pypi_" }
pandas = { index = "pypi_" }
python-dotenv = { index = "pypi_" }
pyyaml = { index = "pypi_" }

[tool.coverage.xml]
output = "coverage-reports/cobertura-coverage.xml"

[tool.coverage.run]
source = ["src"]
branch = true
relative_files = true
omit = ["*/__init__.py",
    ".mypy_cache",
    ".pytest_cache",
    ".git"]

[tool.ruff]
exclude = [
    ".git",
    ".venv",
    "build",
    "dist", "public",
    "tests/resources",
    ".pytest_cache", ".mypy_cache",
    "coverage-reports"
]
indent-width = 4
line-length = 120
target-version = "py312"
include = ["*.py", "*.pyi", "*.ipynb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint.mccabe]
max-complexity = 4

[tool.ruff.lint]
ignore = [
    "B018",
    "C901",
    "F841",
    "ERA001"
]
fixable = ["ALL"]
unfixable = []

select = [
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "ERA", # eradicate
    "T20", # flake8-print
    "I", # isort
    "C90", # mccabe
    "SIM" # Flake8 simplify
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
    "B018",
    "C901",
    "F841",
    "T20",
    "W291",
    "W605",
    "ERA001"
]

[tool.mypy]
files = ["src"]
ignore_missing_imports = true
no_implicit_optional = false
explicit_package_bases = true
